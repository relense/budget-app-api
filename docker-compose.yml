services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget_app
      POSTGRES_PASSWORD: budget_app
      POSTGRES_DB: budget_app
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U budget_app']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
